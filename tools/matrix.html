<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抉择矩阵索引</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --panel: #fffdf8;
      --ink: #25231f;
      --muted: #6d675e;
      --line: #d7d1c5;
      --line-strong: #a79d8c;
      --accent: #176c62;
      --accent-soft: #dcece8;
      --warn: #8a5b17;
      --warn-soft: #f4ead9;
      --blank: #ebe6da;
      --shadow: 0 16px 44px rgba(50, 43, 32, 0.12);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }

    .toolbar input {
      width: min(280px, 42vw);
    }

    main {
      display: grid;
      grid-template-columns: minmax(560px, 1fr) minmax(320px, 420px);
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    .matrix-area,
    .detail {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .matrix-area {
      overflow: auto;
      padding: 12px;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(12, minmax(48px, 1fr));
      gap: 5px;
      min-width: 700px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1.22 / 1;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--blank);
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .cell:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .cell.has-source {
      background: var(--accent-soft);
      border-color: rgba(23, 108, 98, 0.38);
      color: var(--ink);
      font-weight: 700;
    }

    .cell.has-summary:not(.has-source) {
      background: var(--warn-soft);
      border-color: rgba(138, 91, 23, 0.36);
      color: var(--ink);
      font-weight: 700;
    }

    .cell.suspected::after,
    .cell.no-source.has-summary::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--warn);
    }

    .cell.selected {
      outline: 3px solid rgba(23, 108, 98, 0.35);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .cell.hidden {
      display: none;
    }

    .detail {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 86px);
      position: sticky;
      top: 82px;
    }

    .detail h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      line-height: 1.2;
    }

    .badge.source {
      color: var(--accent);
      border-color: rgba(23, 108, 98, 0.35);
      background: var(--accent-soft);
    }

    .badge.warn {
      color: var(--warn);
      border-color: rgba(138, 91, 23, 0.35);
      background: var(--warn-soft);
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .summary {
      margin: 0;
      color: var(--ink);
      line-height: 1.72;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      line-height: 1.5;
    }

    .source-title {
      display: block;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .source-note {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    details {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 700;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 10px 0 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      line-height: 1.55;
      font-family: inherit;
      font-size: 13px;
    }

    .load-error {
      padding: 18px;
      border: 1px solid rgba(138, 91, 23, 0.35);
      border-radius: 8px;
      background: var(--warn-soft);
      color: var(--ink);
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: stretch;
        width: 100%;
      }

      .toolbar input,
      .toolbar select {
        flex: 1 1 180px;
        width: auto;
      }

      main {
        grid-template-columns: 1fr;
        padding-bottom: 50vh;
      }

      .detail {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        top: auto;
        z-index: 30;
        max-height: 45vh;
        overflow: auto;
        padding: 14px;
      }

      .detail h2 {
        font-size: 20px;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 14px;
      }

      main {
        padding: 10px;
        padding-bottom: 52vh;
      }

      .matrix {
        grid-template-columns: repeat(12, 44px);
        min-width: 583px;
      }

      .cell {
        min-height: 36px;
        font-size: 12px;
      }

      .detail {
        left: 8px;
        right: 8px;
        bottom: 8px;
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>抉择矩阵索引</h1>
        <div id="matrixMeta" class="meta">正在读取矩阵数据...</div>
      </div>
      <div class="toolbar" aria-label="矩阵筛选">
        <input id="searchInput" type="search" placeholder="搜索格子、简介、故事书位置">
        <select id="filterSelect">
          <option value="all">全部格子</option>
          <option value="with-source">有故事书位置</option>
          <option value="with-summary">有简介</option>
          <option value="suspected">疑似卡牌/线索来源</option>
          <option value="without-source">没有确定来源</option>
        </select>
      </div>
    </header>

    <main>
      <section class="matrix-area" aria-label="抉择矩阵">
        <div id="matrix" class="matrix"></div>
      </section>

      <aside class="detail" aria-live="polite">
        <h2 id="detailTitle">请选择一个格子</h2>
        <div id="badges" class="badges"></div>

        <section class="section">
          <h3>故事简介</h3>
          <p id="summaryText" class="empty">点击左侧矩阵格子后显示。</p>
        </section>

        <section class="section">
          <h3>故事书位置</h3>
          <ul id="sourceList" class="source-list"></ul>
          <p id="sourceEmpty" class="empty">点击左侧矩阵格子后显示。</p>
        </section>

        <details>
          <summary>原始备注</summary>
          <pre id="rawNotes">点击左侧矩阵格子后显示。</pre>
        </details>
      </aside>
    </main>
  </div>

  <script id="matrix-summaries-data" type="application/json">{"A2":"在《蜡与承诺》里选择「让暮光守望建造他们的星舰」，走到 0006 结算拿到 +1 船体，因此标记。","A10":"这一格只在教程《LTP 上手指南》里出现：当船员的饥饿问题逼到面前时，你们选择强行没收那名商人的物资来解决，因此记下这一格。该指南不在故事书数据中，C1–C5 正文里本格 0 次出现，仓库内没有可核对的原文。","A6":"先完成「有目标的人」枢纽，再在 0076 选「揭示真相」走到 0102，取得角誓者的支持（外交 +2、阿尔戈号命运 −2），因此标记。","A1":"在《内蕴奥德赛》第 12 篇收留阿尔戈尼特人、并给新得到的泰坦起名时，记下这一格。","A3":"在《无法回头》里鼓励克莱奥尼玛继续尝试拯救城邦（结算获得 +1 悖论），因此标记。","A7":"跳过教程时，你们按清单领取全部初始物资：4 张阿尔戈英雄卡、阿尔戈号记录表、各类装备与科技卡，以及神浆原液、西西弗斯之泪等资源，并在时间线上标出 T0 到 T6；清单的最后一步是在抉择矩阵上随机标一格，作为正式启航的起点——本格就是被抽中的那一半概率（另一个是 A8）。若没有跳过教程，则走教程「船骸水域」：你们选择把阿尔戈号开进深处保护特遣队，船体因此受损、失去 1 点船体，于是记下这一格。","A9":"两处都会记下这一格。其一在教程：遇到那名商人后，你们放他离开、索取海岸地图作为交换，代价是失去 1 点命运，米诺斯人外交 +1、角誓者外交 −1。其二在《我们身后留下的》：你们最后一次回望埃拉提亚镇——它挺立在德尔菲荒原的冰雪中，是周边民众可以求助的堡垒，而太阳后裔将牢牢控制这一地区；你们自问这对人民来说是否是更好的结果，因此记下这一格并获得 1 个进展指示物。","A4":"先完成「赤裸裸的梦想」枢纽，再在 0076／0083 选「揭示真相」走到 0101——你们向皮里托奥斯揭穿忒修斯还活着，换来角誓者结盟（外交 +1、阿尔戈号命运 −2），因此标记。","A8":"跳过教程时，你们按清单领取全部初始物资（含西西弗斯之泪等神圣资源，以及各类装备与科技卡），清单最后一步是在抉择矩阵上随机标一格，本格与 A7 各占一半概率。若没有跳过教程，则走教程「船骸水域」：面对是让船员冒险探索沉船、还是保全阿尔戈号本身，你们选择让船员承担风险，结果失去 1 名船员，于是记下这一格。","B3":"休憩冒险「很多很多的山羊」：遭遇那群山羊时记下这一格（若此前标记过 A1，还会立刻重置阿尔戈号命运、让山羊消失）。","A11":"回忆突破《塞壬幸存者》里面对「接受死亡还是继续循环」：两条路都会记下这一格，它是这次回忆突破被结算的记录（接受死亡会退役英雄并换得玛土撒拉装备）。","B1":"《隐匿于众目睽睽之下》开场面对求助，你们选择了「拒绝提供帮助」，因此标记。","A12":"回忆突破卡里关于「离开还是留下」的抉择：让阿尔戈号走替代路线，或留下继续战斗，两种回答都会记下这一格。","B6":"在《深渊凝视者》主线选择「攻击代表团、消灭尼采超人」（付出 1 点人性），混战中尼采超人放出狠话、每位阿尔戈英雄 +1 愤怒，因此标记。","B5":"先完成「赤裸裸的梦想」枢纽，再向米诺斯追问真相走到 0103，换来迷宫徒与角誓者双方的支持（各外交 +1），因此标记。","B4":"《致逝者》的剧情2A线索卡 CC1563「捐赠精炼神浆」：在板块 54 的故事阶段失去任意 10 个原初资源、查出神浆库存的杂质，因此标记；这张卡只是每局抽出的 3 张之一，直到 0059 才正式写进矩阵。","B7":"《米诺陶洛斯之泪》里你们用武力赶走那些侮辱者（而不是另想办法），战斗成功后贝莱马克道谢并指引你们找到野性泰坦，拿到 +1 泰坦 时标记。","B10":"《另一场温泉关之战》中你们阻止叛军杀死独眼巨人，事后看着他们消失在山丘后、拿到 2 个黑色锁链资源，因此标记。","B8":"《凝视蝼蚁》里在 0007 选「坚定你的心，没有回头路了」：你们炸毁军械库、烧死里面的独眼巨人，队长为此得到 +1 怒气——这一格记的就是这次不光彩的胜利。","B12":"回忆突破卡里关于父亲的抉择：与父亲和解、离开阿尔戈号，或者拒绝他、留在船上——两条路都会记下这一格。","C2":"主线里面对邦联同盟的请求，你们选择帮助他们把马拉松号重新下水，因此记下这一格。","B11":"回忆突破 M040／M042 面对「承认还是否认米诺斯血统」——两种回答都会记下这一格，它是「你们的英雄具有米诺斯血统」这件事的记录。","C4":"《痛苦产业》里面对邦联同盟的火焰弩炮，你们站 觉到了它则标记为 L。","CC10":"《我的佩涅罗佩》（内蕴奥德赛 101）：整段只有一句「我的佩涅罗佩，我一生所爱」，紧接着就是标记这一格的代码（原文 Mark CC 10）——读到这段告白时就把这一格记下。","CC9":"《真理的半衰期》里对「不惜一切代价」的回答：愿意付出一切标记为 T；拒绝这种逻辑标记为 L；认为世上几乎没有绝对真理则直接记下这一格。","DD1":"C5 主线里那位学者恳求你们「别这么做」：相信他就标记为 T，不信则标记为 L。","DD2":"C5 主线里船员因不安而想离开：因恐惧把他们解雇标记为 T（失去 −1）；训斥他们但把人留在船上则标记为 L（获得 +1）。","DD3":"C5 主线里你们从被污浊空气笼罩的水下城市撤离、并给它留下一个废墟指示物（同时在时间线上添加「飞蛾扑火」特殊事件），因此标记为 T。","CC11":"C5 主线里撤离时的两种处置：不理会那些激动的平民、专注完成任务标记为 L；把他们当作囚犯制服则标记为 T。","DD4":"C5 主线里你们选择保留已有的联络员计数标记、不做移除，因此标记为 T 并返回航行阶段。","DD6":"C5 主线里你们是否移除一个联络员计数标记：如果不移除，就把这一格标记为 T（随后翻到「黑暗镜中」灾祸卡，并读它）。","DD5":"C5 主线里关于那几名囚犯的处置：0109 处承诺为未来奋斗、把他们带走标记为 T，选择另一条路标记为 L；6127 处还要求圈出这一格。","CC12":"C5 主线里「敌人的面孔」这条线的多种收束都会记下这一格：0037 里拒绝把阿尔戈号交给他们并做一个必需品计数标记（标记为 T）；2403／2418 的分支里标记为 L；终局 8713 处还要求圈出它（即使未被标记）。","DD10":"C5 主线里涅墨西斯号地图上的一次结算（减去 −2，随后返回地图），因此记下这一格。","DD7":"C5 主线里那声大笑之后：你们打开信封 BETA，并在地图上生成黑喙追踪者（距离阿尔戈号 4 个板块），因此标记为 T。","DD11":"C5 主线里将军宣布休会后的条件结算记下这一格（为 L）；终局 8708 处还要求圈出它。","DD12":"C5 主线里你们坚持「我只跟伊阿宋说话」（随后前往 5425 的那段对峙），因此记下这一格。","DD9":"C5 主线里镜片被彻底损毁、一切化为烟雾与光芒之后记下这一格；6123 处还要求圈出它。","EE1":"C5 主线里那个人再也不会回到阿尔戈号（同时把尚未解决的中枢 7「寒冷」标记为已解决），因此记下这一格。","DD8":"C5 主线里两处会记下这一格：一处是「如果你有 3+（某标记）就失去 −1」并标记为 T；另一处是未经审判就把阿尔戈号交出去（追随者外交 +1、保护国外交 −1，换来一份稀罕资源）标记为 L。","EE3":"C5 主线里关于中介者与驾驶员席位的决定：把中介者让给伊阿宋标记为 T（你们成为第四位驾驶员）；拒绝伊阿宋、自己保留中介者则标记为 L。","EE4":"C5 主线里涅墨西斯号地图上的一次结算（获得 +1，随后返回地图），因此记下这一格。","EE2":"C5 主线里那个男孩：决定带上他标记为 T（并获得 1 个记忆之回响）；在 8708 处喊出「我叫亚历山大！」则标记为 L。","EE5":"C5 主线里那位没有肚脐的短发女人面对队长的盘问表明身份之后获得 +1，因此记下这一格。","FF3":"C5 结局里先锋队在涅墨西斯号之战后解散、骑士们得以回到他们发誓保护的人民中间生活（8696 的分支），因此标记为 L。","FF1":"C5 结局里罗德岛势力渗入基克拉泽斯群岛的两种走向：保护国无力抗衡、对抗组织乐于支持（标记为 L）；或他们只要求基克拉泽斯人向高王屈膝（标记为 T）。","FF4":"C5 结局里那个骑士团在随后的几十年里慢慢淡出历史舞台，因此记下这一格。","FF2":"同一段结局的另一组分支：罗德岛放弃对保护国的赞助、一两代人后再带着战舰回来（标记为 L）；或出现打破两极体系的第三股力量（标记为 T）。","FF5":"C5 结局里哈利罗提奥斯的统治越来越偏宗教狂热、许多圣骑士带着舰队背离他（波塞冬信徒的残余却得到青睐），因此记下这一格。","FF7":"C5 结局里一个新的、更开明的王国慢慢繁荣起来，也许终将引领凡人国家走向更好的明天，因此记下这一格。","FF6":"C5 结局里尼卡诺尔（或他的继任者）终有一天会回来夺回亚特兰提斯应有的遗产，因此记下这一格。","FF10":"C5 结局里先锋队的去向：骑士与圣骑士继续在大海及其下方的世界巡游、保护人们免受末世遗留的怪物侵害（标记为 L）；或他们的复国之战永无止境（标记为 T）。","FF9":"同一段的另一组分支：追随者的队伍再也没能回到鼎盛规模，但也没有减少（标记为 L）；或世界终于迎来真正的凡人黎明（标记为 T）。","FF8":"C5 结局里关于「真相诉说者」运动的两种收束：它像其他昙花一现的运动一样湮没无闻（标记为 L）；或维尔塔里的信徒继承他的精神、用善言与榜样而非暴力传播阿瑞特之光（标记为 T）。","B2":"《螺旋秘密》里以泰坦为代价对付无颚海妖的三条分支都会记下这一格：0028（拆掉神庙支柱、让圣所沉入海底，需先前已标记 D7 或 E10）、0068 与 0069（消耗泰坦把它赶回大海）。","C1":"《螺旋秘密》里在 0003 选「派遣舰队搜寻塞壬活动的迹象」，随后在 0005 捡到那本狂乱涂鸦的日记（「下巴不见了，捂住耳朵」）——这一格记录的就是发现这本日记。","D7":"《螺旋秘密》里与无颚海妖的第一次交锋：泰坦替你们挡下攻击并与怪物冲突，与泰坦相连的阿尔戈英雄 +1 愤怒，因此标记。","E10":"《螺旋秘密》里与无颚海妖交锋的另一条结果：泰坦与怪物冲突却没能压制住它，与泰坦相连的英雄 +2 危险、学者在混乱中失踪，因此标记。","F9":"《螺旋秘密》里在 0007 选「没有时间了，奉上祭品以安抚实体」，消耗一名泰坦把怪物安抚下去，因此标记。","J4":"《螺旋秘密》的收尾（0086）：塞壬消失、攻击结束，领取奖励并把临时装备归还原处，随后记下这一格并返回航行阶段。","N6":"《螺旋秘密》里面对海底升起的巨型雕像，你们选择揭开它的秘密（0015 选项 2），因此标记并播撒阿尔戈知识。","N7":"同一处的另一种选择：你们判断有些知识应该继续沉睡，命令迷宫居民封存那个地方（0015 选项 1），因此标记。","N9":"《螺旋秘密》里面对螺旋教派的两种处理都会记下这一格：为还愿意听的人点亮指路明灯（0024），或用一次力量展示让他们让路后离开（0025）。","P9":"《螺旋秘密》里你们在「搁浅」剧情中放过受伤的海妖、等它的同类来接走它（0040 选项 1），因此标记。","F8":"本格在 C1–C5 正文里没有「标记」指令：它记录的是你们进入《过去的罪孽》清污任务前已经背负的状态，开场段落只检查它是否已标记并据此分流。","U6":"《过去的罪孽》里你们终结了斯巴达废墟下的黑工业、让帝国的肮脏秘密曝光（可任选 +1 船体、+1 泰坦或 +1 阿尔戈知识），因此标记。","Z8":"《未来继承者》里你们继续调查列奥尼达这个「继承人」是否真有血脉与合法性（播撒阿尔戈知识），因此记下这一格。","Z9":"《过去的罪孽》里你们展现出另一种可能，让西亚格拉承认「我们需要变得更好」（0053 选项 2，播撒船员），因此记下这一格。","V11":"回忆突破 M027 选项 1：选择留在阿尔戈号上继续冒险时标记（若你的阿尔戈英雄死去就把它划掉）；选项 2 那条离开的路会标记 U11。","W11":"C5 休憩冒险里「塔雷亚花园」的两种处置都会记下这一格：为最后学院收集珊瑚碎片（标记为 L，播种进展），或让花园保持原样、远离凡人（标记为 N）。"}</script>
  <script>
    const rows = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").concat(["AA", "BB", "CC", "DD", "EE", "FF"]);
    const notesDataElement = document.querySelector("#matrix-notes-data");
    const summariesDataElement = document.querySelector("#matrix-summaries-data");
    const embeddedNotes = JSON.parse(notesDataElement.textContent);
    const summaries = JSON.parse(summariesDataElement.textContent);
    const state = {
      notes: {},
      selected: "",
      query: "",
      filter: "all",
    };

    const elements = {
      meta: document.querySelector("#matrixMeta"),
      matrix: document.querySelector("#matrix"),
      search: document.querySelector("#searchInput"),
      filter: document.querySelector("#filterSelect"),
      title: document.querySelector("#detailTitle"),
      badges: document.querySelector("#badges"),
      summary: document.querySelector("#summaryText"),
      sourceList: document.querySelector("#sourceList"),
      sourceEmpty: document.querySelector("#sourceEmpty"),
      rawNotes: document.querySelector("#rawNotes"),
    };

    function cellCodes() {
      const codes = [];
      for (const row of rows) {
        for (let col = 1; col <= 12; col += 1) codes.push(`${row}${col}`);
      }
      return codes;
    }

    function parseSources(notes) {
      const results = [];
      const seen = new Set();
      const regex = /\bC([1-5](?:\.5)?)\s*\|\s*(.+?)\s*>\s*(.+?)\s+line\s+(\d+):\s*(.*)$/;
      for (const note of notes || []) {
        const match = note.match(regex);
        if (!match) continue;
        const suspected = /疑似来源|实体线索卡|实体卡牌|特殊事件卡|后文检查/.test(note);
        const key = `${match[1]}|${match[2]}|${match[3]}|${match[4]}|${suspected}`;
        if (seen.has(key)) continue;
        seen.add(key);
        results.push({
          book: `C${match[1]}`,
          chapter: match[2].trim(),
          entry: match[3].trim(),
          line: match[4].trim(),
          excerpt: match[5].trim(),
          suspected,
        });
      }
      return results;
    }

    function hasSuspectedSource(notes) {
      return (notes || []).some((note) => /疑似来源|实体线索卡|实体卡牌|特殊事件卡/.test(note));
    }

    function cellInfo(code) {
      const notes = state.notes[code] || [];
      const summary = summaries[code] || "";
      const sources = parseSources(notes);
      const solidSources = sources.filter((source) => !source.suspected);
      return {
        code,
        notes,
        summary,
        sources,
        solidSources,
        suspected: hasSuspectedSource(notes) || sources.some((source) => source.suspected),
      };
    }

    function matchesFilter(info) {
      if (state.filter === "with-source") return info.solidSources.length > 0;
      if (state.filter === "with-summary") return Boolean(info.summary);
      if (state.filter === "suspected") return info.suspected;
      if (state.filter === "without-source") return info.solidSources.length === 0;
      return true;
    }

    function matchesQuery(info) {
      const query = state.query.trim().toLowerCase();
      if (!query) return true;
      const haystack = [
        info.code,
        info.summary,
        ...info.notes,
        ...info.sources.map((source) => `${source.book} ${source.chapter} ${source.entry} line ${source.line}`),
      ].join("\n").toLowerCase();
      return haystack.includes(query);
    }

    function renderMatrix() {
      const codes = cellCodes();
      let visible = 0;
      let withSource = 0;
      let withSummary = 0;
      let suspected = 0;
      elements.matrix.innerHTML = "";

      for (const code of codes) {
        const info = cellInfo(code);
        const show = matchesFilter(info) && matchesQuery(info);
        if (info.solidSources.length) withSource += 1;
        if (info.summary) withSummary += 1;
        if (info.suspected) suspected += 1;
        if (show) visible += 1;

        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "cell",
          info.solidSources.length ? "has-source" : "no-source",
          info.summary ? "has-summary" : "",
          info.suspected ? "suspected" : "",
          state.selected === code ? "selected" : "",
          show ? "" : "hidden",
        ].filter(Boolean).join(" ");
        button.textContent = code;
        button.title = `${code}\n${info.summary || "暂无简介"}\n${info.solidSources.length ? `${info.solidSources.length} 个故事书位置` : "没有确定故事书来源"}`;
        button.addEventListener("click", () => selectCell(code));
        elements.matrix.appendChild(button);
      }

      elements.meta.textContent = `显示 ${visible}/${codes.length} 格；有故事书位置 ${withSource} 格，有简介 ${withSummary} 格，疑似卡牌/线索来源 ${suspected} 格。`;
    }

    function makeBadge(text, className = "") {
      const badge = document.createElement("span");
      badge.className = ["badge", className].filter(Boolean).join(" ");
      badge.textContent = text;
      return badge;
    }

    function selectCell(code) {
      state.selected = code;
      const info = cellInfo(code);
      elements.title.textContent = code;
      elements.badges.innerHTML = "";
      elements.badges.appendChild(makeBadge(info.summary ? "有简介" : "暂无简介", info.summary ? "source" : ""));
      elements.badges.appendChild(makeBadge(info.solidSources.length ? `${info.solidSources.length} 个故事书位置` : "没有确定来源", info.solidSources.length ? "source" : "warn"));
      if (info.suspected) elements.badges.appendChild(makeBadge("疑似卡牌/线索来源", "warn"));

      elements.summary.className = info.summary ? "summary" : "empty";
      elements.summary.textContent = info.summary || "暂无故事简介。";

      elements.sourceList.innerHTML = "";
      if (info.sources.length) {
        elements.sourceEmpty.hidden = true;
        for (const source of info.sources) {
          const item = document.createElement("li");
          item.className = "source-item";

          const title = document.createElement("span");
          title.className = "source-title";
          title.textContent = `${source.book} | ${source.chapter} > ${source.entry}，line ${source.line}`;
          item.appendChild(title);

          const note = document.createElement("span");
          note.className = "source-note";
          note.textContent = `${source.suspected ? "备注/疑似来源：" : "摘录："}${source.excerpt || "无摘录"}`;
          item.appendChild(note);

          elements.sourceList.appendChild(item);
        }
      } else {
        elements.sourceEmpty.hidden = false;
        elements.sourceEmpty.textContent = info.notes.length
          ? "这格有备注，但没有解析到明确的故事书位置。请看下方原始备注。"
          : "这格目前没有来源备注。";
      }

      elements.rawNotes.textContent = info.notes.length ? info.notes.join("\n\n") : "暂无原始备注。";
      window.location.hash = code;
      renderMatrix();
    }

    function selectInitialCell() {
      const hash = decodeURIComponent(window.location.hash.replace(/^#/, "")).toUpperCase();
      const codes = new Set(cellCodes());
      if (codes.has(hash)) {
        selectCell(hash);
        return;
      }
      const firstUseful = cellCodes().find((code) => {
        const info = cellInfo(code);
        return info.summary || info.notes.length;
      });
      selectCell(firstUseful || "A1");
    }

    function showLoadError(error) {
      elements.matrix.innerHTML = "";
      const box = document.createElement("div");
      box.className = "load-error";
      box.textContent = `矩阵数据读取失败：${error.message || error}。请通过本地服务器打开此页面，例如 http://127.0.0.1:端口/record/matrix.html。`;
      elements.matrix.appendChild(box);
      elements.meta.textContent = "矩阵数据读取失败";
    }

    elements.search.addEventListener("input", () => {
      state.query = elements.search.value;
      renderMatrix();
    });

    elements.filter.addEventListener("change", () => {
      state.filter = elements.filter.value;
      renderMatrix();
    });

    try {
      state.notes = embeddedNotes;
      renderMatrix();
      selectInitialCell();
    } catch (error) {
      showLoadError(error);
    }
  </script>
</body>
</html>
